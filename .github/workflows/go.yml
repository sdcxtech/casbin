name: Go

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: ['*']

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.20", "1.19", "1.18"]

    steps:

    - name: Setup Go environment
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go }}

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Load cached dependencies
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download Dependencies
      run: go mod download

    - name: Test
      if: matrix.go == '1.20'
      run: make test

  lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.20", "1.19", "1.18"]

    steps:
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: false
    - name: Checkout code
      uses: actions/checkout@v6
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12
